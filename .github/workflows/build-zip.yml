name: Build plugin zip

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  zip:
    name: Generate installable zip artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Simple zip build that works before the plugin is approved on WordPress.org
      # (the 10up zip action requires an existing SVN repository).
      - name: Build zip (respecting .distignore)
        run: |
          mkdir -p /tmp/package/weight-based-product-packs
          rsync -r --exclude-from=.distignore ./ /tmp/package/weight-based-product-packs/
          cd /tmp/package && zip -rq weight-based-product-packs.zip weight-based-product-packs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weight-based-product-packs
          path: /tmp/package/weight-based-product-packs.zip
